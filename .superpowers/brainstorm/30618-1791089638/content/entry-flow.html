<h2>先确定 Heartrace 的第一目标</h2>
<p class="subtitle">请选择你希望用户每天打开应用后最先完成的事情。这个选择会决定首页信息层级和后续需求优先级。</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>快速记录当下情绪</h3>
      <p>打开即选心情，10 秒内完成一次记录；专注计时和趋势回顾作为辅助入口。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>查看今天的状态</h3>
      <p>首页优先展示今日情绪曲线、记录时间线和能量变化，帮助用户先理解自己。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>开始一段专注时间</h3>
      <p>打开即开始短时专注，结束后补充情绪和能量记录，形成“专注—觉察”闭环。</p>
    </div>
  </div>
</div>

<div class="section">
  <h3>当前产品已有基础</h3>
  <div class="split">
    <div class="mockup">
      <div class="mockup-header">Today</div>
      <div class="mockup-body">
        <div class="mock-nav">心情选择 · 能量 · 计时器</div>
        <div class="placeholder" style="height:75px">今日能量曲线</div>
        <div class="placeholder" style="height:55px">当日记录时间线</div>
      </div>
    </div>
    <div class="mockup">
      <div class="mockup-header">Insights</div>
      <div class="mockup-body">
        <div class="placeholder" style="height:75px">趋势摘要</div>
        <div class="placeholder" style="height:55px">按日 / 月 / 年查看记录</div>
      </div>
    </div>
  </div>
</div>
